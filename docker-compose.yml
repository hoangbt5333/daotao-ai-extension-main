services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daotao-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./backend/.env:/app/.env # nếu có file .env
      - ./backend/exports:/app/exports
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: daotao-frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - ./frontend/.env:/app/.env # nếu có file .env
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    restart: unless-stopped
